# Continuous Integration for Carbon White.
#
# Gates, in order of increasing cost:
#   1. formatting  - rustfmt
#   2. lints       - clippy over three feature configurations
#   3. unit tests  - default and `ssr` feature sets
#   4. build       - `cargo leptos build` compiles wasm + SSR and emits the site
#
# Each feature set is linted separately on purpose. Code behind
# `#[cfg(feature = ...)]` is never type-checked outside its own configuration, so
# a single lint run leaves whole areas of the app unchecked: the `ssr` build
# compiles out the browser code, the wasm build compiles out the server code, and
# a default-feature build compiles out both.

name: CI - Build Carbon White

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Stop a superseded run on the same ref from consuming a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build with cargo leptos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-leptos
        run: cargo binstall cargo-leptos --no-confirm

      - name: Cache cargo and cargo-leptos artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      # Cheapest lint pass: no server or browser dependencies are compiled here,
      # so it runs first and fails fastest. Catches dead code that only appears
      # when neither `ssr` nor `hydrate` is enabled.
      - name: Lint (host / default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Lint (host / ssr)
        run: cargo clippy --all-targets --features ssr -- -D warnings

      - name: Lint (wasm / hydrate)
        run: cargo clippy --lib --features hydrate --target wasm32-unknown-unknown -- -D warnings

      - name: Test (default features)
        run: cargo test

      - name: Test (ssr, all targets)
        run: cargo test --features ssr --all-targets

      - name: Build Carbon-White
        run: cargo leptos build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carbon-white-site
          path: target/site
          retention-days: 7
