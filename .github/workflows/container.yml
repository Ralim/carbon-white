name: Create and publish a Docker image

# Runs every time a change is pushed to `main`.
on:
  push:
    branches: ["main"]

# Read-only by default; the publishing job opts in to the scopes it needs.
permissions:
  contents: read

# Two pushes in quick succession must not race each other into the registry.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    # Third-party actions are pinned to commit SHAs so a moved tag cannot
    # change what runs with registry write access.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installed explicitly so reading the crate version does not depend on
      # the runner image happening to ship cargo.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # Reads the version the crate declares in Cargo.toml, so the image is
      # tagged with the same version the package publishes under rather than
      # something derived from the git ref. Fails loudly if it cannot be read,
      # rather than silently publishing an untagged image.
      - name: Read crate version from Cargo.toml
        id: crate-version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Could not read the crate version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The default docker driver cannot export the GitHub Actions build cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built into the local daemon first so it can be smoke tested before
      # anything is pushed. The push below reuses these layers from the cache.
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: carbon-white:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Starts the image, exercises the pages and API, and fails if the server
      # does not come up, panics, or does not shut down cleanly on SIGTERM.
      - name: Smoke test image
        shell: bash
        env:
          IMAGE: carbon-white:smoke-test
        run: |
          set -euo pipefail

          container=carbon-white-smoke-test
          base=http://127.0.0.1:8080

          docker run --detach --name "$container" \
            --publish 127.0.0.1:8080:8080 \
            --env CARBON_AUTH_KEY=ci-smoke-test-key \
            "$IMAGE" >/dev/null

          # Logs are printed and the container removed whatever the outcome.
          cleanup() {
            echo "::group::Container logs"
            docker logs "$container" 2>&1 || true
            echo "::endgroup::"
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          fail() {
            echo "::error::$1"
            exit 1
          }

          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null "$base/"; then
              break
            fi
            [ "$(docker inspect --format '{{.State.Running}}' "$container")" = true ] \
              || fail "Container exited during startup"
            sleep 1
          done
          curl --silent --fail --output /dev/null "$base/" \
            || fail "Server did not answer within 30 seconds"

          expect() {
            local method=$1 path=$2 expected=$3 status
            shift 3
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request "$method" "$@" "$base$path")
            [ "$status" = "$expected" ] \
              || fail "$method $path returned $status, expected $expected"
          }

          expect GET / 200
          expect GET /all 200
          expect GET /pkg/carbon-white.css 200
          expect GET /favicon.ico 200
          expect GET "/api/search?q=" 200
          expect GET "/api/search?q=datasheet" 200
          expect GET /api/documents 200
          expect GET /api/auth/status 200
          expect GET /file/not-a-hash 400
          expect GET "/file/$(printf '0%.0s' $(seq 64))" 404
          expect POST /api/auth 200 \
            --header 'content-type: application/json' --data '{"auth_key":"wrong"}'

          logs=$(docker logs "$container" 2>&1)
          grep -q "listening on" <<<"$logs" || fail "Server never reported that it was listening"
          if grep -q "panicked" <<<"$logs"; then
            fail "Server panicked"
          fi
          [ "$(docker inspect --format '{{.State.Running}}' "$container")" = true ] \
            || fail "Container exited while serving requests"

          # SIGTERM must drain and exit cleanly rather than time out into SIGKILL.
          docker stop --time 10 "$container" >/dev/null
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$container")
          [ "$exit_code" = 0 ] || fail "Server exited with status $exit_code on SIGTERM"
          logs=$(docker logs "$container" 2>&1)
          if grep -q "panicked" <<<"$logs"; then
            fail "Server panicked during shutdown"
          fi

      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Setting `tags` replaces the action's implicit defaults, so the
          # branch and SHA tags that used to be produced are listed explicitly
          # alongside the new crate-version tag.
          tags: |
            type=ref,event=branch
            type=raw,value=${{ steps.crate-version.outputs.version }}
            type=sha
      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see [Usage](https://github.com/docker/build-push-action#usage) in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how it was built. It increases supply chain security for people who consume the image. For more information, see [Using artifact attestations to establish provenance for builds](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds).
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
