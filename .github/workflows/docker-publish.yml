name: Publish Docker image (manual)

# Manually triggered from the Actions tab. The branch to build is chosen by the
# person running the workflow rather than by whatever was last pushed, so a
# release can be cut from any branch without merging it to main first.
#
# Only triggers once this file is present on the repository's default branch;
# GitHub only offers the "Run workflow" button for workflows it can see there.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and publish
        required: true
        type: string

# Least privilege by default. The job that actually pushes opts in to the extra
# scopes it needs, so the permission check below cannot write anything.
permissions:
  contents: read

# Two runs for the same branch must not race each other into the registry.
concurrency:
  group: docker-publish-${{ inputs.branch }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # workflow_dispatch has no built-in permission gate -- GitHub lets anyone who
  # can see the Actions tab press the button. The check has to be explicit.
  authorize:
    name: Check write access
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      detail: ${{ steps.check.outputs.detail }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -uo pipefail

          # `github.actor` is the person who pressed the button, so this cannot
          # be set by the caller. The permission is looked up live rather than
          # inferred from repository settings, which only cover some roles.
          #
          # This fails closed: if the lookup errors for any reason, the answer
          # is no. A deny from a broken check is recoverable, a publish from
          # one is not.
          if ! permission="$(
            gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.permission' 2>/dev/null
          )" || [ -z "${permission}" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "detail=could not determine the access level of ${ACTOR}; denying" >> "$GITHUB_OUTPUT"
            echo "::error::Unable to determine repository access for ${ACTOR}. Denying."
            exit 1
          fi

          # `admin`, `maintain` and `write` are the roles that can already push
          # to this repository, so none of them gains anything new here.
          case "${permission}" in
            admin|maintain|write)
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              echo "detail=${ACTOR} has ${permission} access" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "detail=${ACTOR} has '${permission}' access, write is required" >> "$GITHUB_OUTPUT"
              echo "::error::${ACTOR} has '${permission}' access to ${REPO}. Write access is required to publish an image."
              exit 1
              ;;
          esac

  build-and-push:
    name: Build and push
    needs: authorize
    # Redundant with the failure above, but keeps the intent visible next to the
    # job it protects.
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      # The input reaches `actions/checkout` as a value rather than being
      # interpolated into a shell command, but it is still validated first: this
      # rejects tags, pull request refs, and raw object ids, so the build can
      # only ever come from a real branch.
      - name: Resolve branch
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -uo pipefail

          if ! printf '%s' "${BRANCH}" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::'${BRANCH}' is not a valid branch name."
            exit 1
          fi

          if ! gh api "repos/${REPO}/branches/${BRANCH}" --jq '.name' >/dev/null 2>&1; then
            echo "::error::Branch '${BRANCH}' does not exist in ${REPO}."
            exit 1
          fi

          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.name }}
          fetch-depth: 1
          persist-credentials: false

      # The tag is the commit the branch pointed at when this run started, not
      # `github.sha`. For a manually dispatched workflow those differ: the
      # former is whatever was selected in the Actions dropdown, the latter is
      # the branch actually requested through the input above.
      - name: Resolve image name and commit
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          sha="$(git rev-parse HEAD)"

          # GHCR requires a fully lowercase image path, but repository names may
          # contain uppercase characters.
          repository="$(printf '%s' "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          {
            echo "sha=${sha}"
            echo "name=${REGISTRY}/${repository}"
          } >> "$GITHUB_OUTPUT"

      # The default docker driver cannot export the GitHub Actions build cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built into the local daemon first so it can be smoke tested before
      # anything is pushed. The push below reuses these layers from the cache.
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: carbon-white:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Starts the image, exercises the pages and API, and fails if the server
      # does not come up, panics, or does not shut down cleanly on SIGTERM.
      - name: Smoke test image
        shell: bash
        env:
          IMAGE: carbon-white:smoke-test
        run: |
          set -euo pipefail

          container=carbon-white-smoke-test
          base=http://127.0.0.1:8080

          docker run --detach --name "$container" \
            --publish 127.0.0.1:8080:8080 \
            --env CARBON_AUTH_KEY=ci-smoke-test-key \
            "$IMAGE" >/dev/null

          # Logs are printed and the container removed whatever the outcome.
          cleanup() {
            echo "::group::Container logs"
            docker logs "$container" 2>&1 || true
            echo "::endgroup::"
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          fail() {
            echo "::error::$1"
            exit 1
          }

          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null "$base/"; then
              break
            fi
            [ "$(docker inspect --format '{{.State.Running}}' "$container")" = true ] \
              || fail "Container exited during startup"
            sleep 1
          done
          curl --silent --fail --output /dev/null "$base/" \
            || fail "Server did not answer within 30 seconds"

          expect() {
            local method=$1 path=$2 expected=$3 status
            shift 3
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request "$method" "$@" "$base$path")
            [ "$status" = "$expected" ] \
              || fail "$method $path returned $status, expected $expected"
          }

          expect GET / 200
          expect GET /all 200
          expect GET /pkg/carbon-white.css 200
          expect GET /favicon.ico 200
          expect GET "/api/search?q=" 200
          expect GET "/api/search?q=datasheet" 200
          expect GET /api/documents 200
          expect GET /api/auth/status 200
          expect GET /file/not-a-hash 400
          expect GET "/file/$(printf '0%.0s' $(seq 64))" 404
          expect POST /api/auth 200 \
            --header 'content-type: application/json' --data '{"auth_key":"wrong"}'

          logs=$(docker logs "$container" 2>&1)
          grep -q "listening on" <<<"$logs" || fail "Server never reported that it was listening"
          if grep -q "panicked" <<<"$logs"; then
            fail "Server panicked"
          fi
          [ "$(docker inspect --format '{{.State.Running}}' "$container")" = true ] \
            || fail "Container exited while serving requests"

          # SIGTERM must drain and exit cleanly rather than time out into SIGKILL.
          docker stop --time 10 "$container" >/dev/null
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$container")
          [ "$exit_code" = 0 ] || fail "Server exited with status $exit_code on SIGTERM"
          logs=$(docker logs "$container" 2>&1)
          if grep -q "panicked" <<<"$logs"; then
            fail "Server panicked during shutdown"
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exactly one tag: the full commit SHA. No version tag and no moving
      # `latest` tag, so an image that is running is always traceable to an
      # exact commit.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summarise
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHA: ${{ steps.image.outputs.sha }}
          BRANCH: ${{ steps.target.outputs.name }}
        run: |
          echo "Published ${IMAGE}:${SHA}"
          echo "from branch '${BRANCH}'"
